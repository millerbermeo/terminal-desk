appId: dev.odesk.agent
productName: Odesk Agent
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  - out/main/**
linux:
  icon: icon.png
  target: [AppImage, deb]
  category: Development
mac:
  target: dmg
  # Dictado por voz del Asistente: sin esto macOS niega el micrófono a la app empaquetada.
  extendInfo:
    NSMicrophoneUsageDescription: Odesk Agent usa el micrófono solo mientras dictas un mensaje al Asistente.
win:
  icon: icon.ico
  target: nsis
